[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbook-ml"
version = "1.0.0"
description = "Short-horizon crypto price-direction forecasting from Binance L2 order book microstructure."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Saksham Garg" }]
keywords = ["order book", "market microstructure", "binance", "machine learning", "catboost", "shap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "aiohttp>=3.9",
    "altair>=5.0",
    "catboost>=1.2",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "shap>=0.45",
    "streamlit>=1.50",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
obml = "orderbook_ml.cli:main"

[project.urls]
Repository = "https://github.com/sakshamg251206/quant-orderbook-ml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orderbook_ml = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "N"]
ignore = [
    "N803", # ML convention: X_train / X_test argument names
    "N806", # ML convention: X / X_val local variable names
]

[tool.ruff.lint.isort]
known-first-party = ["orderbook_ml"]

[tool.mypy]
packages = ["orderbook_ml"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:shap.*",
    "ignore::FutureWarning:shap.*",
    "ignore::PendingDeprecationWarning:shap.*",
]

[tool.coverage.run]
source = ["orderbook_ml"]

